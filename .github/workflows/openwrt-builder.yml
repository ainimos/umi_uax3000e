name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'Set LAN IP Address'
        required: false
        default: '192.168.1.1'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: immortalwrt-mt798x-6.6.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Env Init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext xorriso git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm \
            lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd
          
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source
        run: |
          rm -rf openwrt
          git clone --depth=50 --branch=$REPO_BRANCH $REPO_URL openwrt

      - name: Feeds & Config
        run: |
          cd openwrt
          if [ -e ../feeds.conf.default ]; then cp ../feeds.conf.default feeds.conf.default; fi
          if [ -e ../$DIY_P1_SH ]; then chmod +x ../$DIY_P1_SH; ../$DIY_P1_SH; fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ -e ../$CONFIG_FILE ]; then cp ../$CONFIG_FILE .config; fi
          if [ -e ../$DIY_P2_SH ]; then chmod +x ../$DIY_P2_SH; ../$DIY_P2_SH; fi

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1
          find dl -size -1024c -delete

      - name: Compile
        run: |
          cd openwrt
          make distclean
          make olddefconfig
          THREADS=$(nproc)
          if ! make -j$THREADS; then
            echo "Retry with single thread"
            make -j1 V=s
          fi
          
          THREADS=$(nproc)
          if ! make -j$THREADS; then
            echo "Retry with single thread"
            make -j1 V=s
          fi
          DEVICE_NAME=$(grep -oP 'CONFIG_TARGET.*DEVICE_\K[^=]+(?=y)' .config | head -n1)
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          FILE_DATE=$(date +%Y%m%d%H%M)
          echo "FILE_DATE=$FILE_DATE" >> $GITHUB_ENV

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: openwrt/bin/targets/*/*
