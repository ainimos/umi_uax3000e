名称：OpenWrt
构建器: OpenWrt Builder: OpenWrt Builder

在:::
  仓库派送:::
    类型：[自动构建固件]: [auto-build-firmware]: [auto-build-firmware]
  工作流_派送:::
    输入：::
      版本号:::
        描述：'构建版本': 'Build Version': 'Build Version'
        必填: true: true: true: true
        默认：'padavanonly/immortalwrt-mt798x-6.6'：'padavanonly/immortalwrt-mt798x-6.6': 'padavanonly/immortalwrt-mt798x-6.6'
        类型：选择: choice: choice
        选项：:
          - padavanonly/immortalwrt-mt798x-6.6padavanonly/immortalwrt-mt798x-6.6padavanonly/immortalwrt-mt798x-6.6padavanonly/immortalwrt-mt798x-6.6
      lan_ip:::
        描述: '设置局域网IP地址': 'Set LAN IP Address': '设置局域网IP地址': 'Set LAN IP Address'
        必填： false: false: false
        默认值：'192.168.1.1': '192.168.1.1': '192.168.1.1'
      ssh:::
        描述: '通过 SSH 连接到 Actions': '通过 SSH 连接到 Actions': '通过 SSH 连接到 Actions': 'Connect to Actions via SSH'
        必填： false: false: false
        默认：false
        类型：布尔值

环境::
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6: openwrt-24.10-6.6
  系统版本：immortalwrt 24.10
  内核版本: 6.6: 6.6
  FEEDS_CONF: feeds.conf.default: feeds.conf.default
  配置文件: immortalwrt-mt798x-6.6.config: immortalwrt-mt798x-6.6.config
  DIY_P1_SH: diy-part1.sh: diy-part1.sh
  DIY_P2_SH: diy-part2.sh: diy-part2.sh
  默认网络：192.168.1.1
  局域网IP: ${{ github.event.inputs.lan_ip }}: ${{ github.event.inputs.lan_ip }}
  默认主机名: ImmortalWrt: ImmortalWrt
  SSH: ${{ format('{0}', github.event.inputs.ssh) }}
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 关键：强制 Node24，彻底消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      deviceName: ${{ env.DEVICE_NAME }}
      fileDate: ${{ env.FILE_DATE }}
    timeout-minutes: 360  # 3小时，足够，避免6小时被杀

    steps:
      - name: Optimize Disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Env Init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext xorriso git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm \
            lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source
        run: |
          rm -rf openwrt
          git clone --depth=50 --branch=$REPO_BRANCH $REPO_URL openwrt

      - name: Feeds & Config
        run: |
          cd openwrt
          if [ -e ../$FEEDS_CONF ]; then cp ../$FEEDS_CONF feeds.conf.default; fi
          if [ -e ../$DIY_P1_SH ]; then chmod +x ../$DIY_P1_SH; ../$DIY_P1_SH; fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ -e ../$CONFIG_FILE ]; then cp ../$CONFIG_FILE .config; fi
          if [ -e ../$DIY_P2_SH ]; then chmod +x ../$DIY_P2_SH; ../$DIY_P2_SH; fi
          make defconfig

      - name: SSH to Actions
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/ssh2actions@main

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1
          find dl -size -1024c -delete

      - name: Compile
        id: compile
        run: |
          cd openwrt
          THREADS=$(($(nproc) * 3 / 2))
          if ! make -j$THREADS; then
            echo "Retry with -j1"
            make -j1 V=s
          fi
          DEVICE_NAME=$(grep -oP 'CONFIG_TARGET.*DEVICE_\K[^=]+(?=y)' .config | head -n1)
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          FILE_DATE=$(date +%Y%m%d%H%M)
          echo "FILE_DATE=$FILE_DATE" >> $GITHUB_ENV

      - name: Upload Firmware
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: openwrt/bin/targets/*/*

      - name: Release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_DATE }}-${{ env.DEVICE_NAME }}
          files: openwrt/bin/targets/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
